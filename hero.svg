<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yash Gupta — AI-First Full-Stack Engineer</title>
  <desc id="desc">An animated neural-network inspired profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="54" y1="20" x2="1135" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.54" stop-color="#071426"/>
      <stop offset="1" stop-color="#052E2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="110" x2="580" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="line" x1="690" y1="80" x2="1110" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(918 208) rotate(90) scale(176)">
      <stop stop-color="#14B8A6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <path id="pathA" d="M724 112C804 57 905 79 949 158C988 228 1040 251 1115 221"/>
    <path id="pathB" d="M708 284C789 346 880 337 917 259C950 190 1022 132 1118 160"/>
    <path id="pathC" d="M775 201C839 149 930 157 991 218C1032 259 1071 304 1125 321"/>
    <style>
      .network { stroke-dasharray: 8 12; animation: stream 11s linear infinite; }
      .network.slow { animation-duration: 16s; animation-direction: reverse; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      .pulse.delay1 { animation-delay: .7s; }
      .pulse.delay2 { animation-delay: 1.4s; }
      .float { animation: float 5.5s ease-in-out infinite; }
      .float.delay { animation-delay: -2.2s; }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      .scan { animation: scan 5s ease-in-out infinite; }
      @keyframes stream { to { stroke-dashoffset: -200; } }
      @keyframes pulse { 0%,100% { opacity: .65; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.18); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes scan { 0% { transform: translateX(-460px); opacity: 0; } 15%,70% { opacity: .28; } 100% { transform: translateX(520px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="28" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="428" rx="28" fill="url(#grid)"/>
  <ellipse cx="920" cy="214" rx="255" ry="205" fill="url(#orb)"/>
  <circle cx="1070" cy="70" r="90" fill="#0EA5E9" fill-opacity=".06" filter="url(#soft)"/>
  <circle cx="750" cy="370" r="105" fill="#14B8A6" fill-opacity=".06" filter="url(#soft)"/>

  <g opacity=".9">
    <rect x="52" y="44" width="132" height="30" rx="15" fill="#0F2E32" stroke="#155E75"/>
    <circle cx="69" cy="59" r="4" fill="#2DD4BF" class="blink" filter="url(#glow)"/>
    <text x="81" y="64" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">SYSTEM ONLINE</text>
  </g>

  <text x="54" y="143" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4">HELLO, I BUILD INTELLIGENT SYSTEMS</text>
  <text x="50" y="222" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Yash Gupta</text>
  <text x="54" y="262" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">AI-First Full-Stack Engineer  ·  System Architecture  ·  Product Builder</text>

  <g transform="translate(54 302)">
    <rect width="142" height="42" rx="12" fill="#0D272B" stroke="#134E4A"/>
    <text x="71" y="26" text-anchor="middle" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">AI PRODUCTS</text>
    <rect x="154" width="136" height="42" rx="12" fill="#0B2231" stroke="#164E63"/>
    <text x="222" y="26" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">RAG + OKF</text>
    <rect x="302" width="170" height="42" rx="12" fill="#151D35" stroke="#3730A3"/>
    <text x="387" y="26" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">ARCHITECTURE</text>
  </g>

  <rect x="50" y="382" width="530" height="2" rx="1" fill="#1E293B"/>
  <rect x="50" y="382" width="112" height="2" rx="1" fill="#2DD4BF" class="scan" filter="url(#glow)"/>

  <g>
    <use href="#pathA" stroke="url(#line)" stroke-width="2" class="network"/>
    <use href="#pathB" stroke="url(#line)" stroke-width="2" class="network slow"/>
    <use href="#pathC" stroke="url(#line)" stroke-width="1.5" class="network"/>
    <path d="M765 102L781 202L732 289M781 202L918 111L991 218L1118 160M781 202L917 259L1089 338M918 111L949 158L1118 160M917 259L949 158L1115 221" stroke="#64748B" stroke-opacity=".22"/>

    <circle cx="724" cy="112" r="7" fill="#22D3EE" class="pulse" filter="url(#glow)"/>
    <circle cx="708" cy="284" r="6" fill="#2DD4BF" class="pulse delay1" filter="url(#glow)"/>
    <circle cx="775" cy="201" r="10" fill="#5EEAD4" class="pulse delay2" filter="url(#glow)"/>
    <circle cx="918" cy="111" r="7" fill="#818CF8" class="pulse delay1" filter="url(#glow)"/>
    <circle cx="917" cy="259" r="9" fill="#38BDF8" class="pulse" filter="url(#glow)"/>
    <circle cx="991" cy="218" r="12" fill="#2DD4BF" class="pulse delay2" filter="url(#glow)"/>
    <circle cx="1118" cy="160" r="7" fill="#A5B4FC" class="pulse" filter="url(#glow)"/>
    <circle cx="1089" cy="338" r="6" fill="#22D3EE" class="pulse delay1" filter="url(#glow)"/>

    <g class="float">
      <rect x="825" y="65" width="119" height="34" rx="10" fill="#081C27" stroke="#155E75"/>
      <text x="884.5" y="87" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">RETRIEVAL</text>
    </g>
    <g class="float delay">
      <rect x="978" y="275" width="105" height="34" rx="10" fill="#102033" stroke="#3730A3"/>
      <text x="1030.5" y="297" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">EVALUATE</text>
    </g>

    <circle r="4" fill="#FFFFFF" filter="url(#glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#pathA"/></animateMotion>
    </circle>
    <circle r="4" fill="#5EEAD4" filter="url(#glow)">
      <animateMotion dur="5.4s" begin="-2.2s" repeatCount="indefinite"><mpath href="#pathB"/></animateMotion>
    </circle>
    <circle r="3" fill="#A5B4FC" filter="url(#glow)">
      <animateMotion dur="3.8s" begin="-1.1s" repeatCount="indefinite"><mpath href="#pathC"/></animateMotion>
    </circle>
  </g>
</svg>
