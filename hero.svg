<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Yash Gupta  AI Digital Solutions &amp; SaaS Builder</title>
  <desc id="desc">Dark teal gradient banner for Yash Gupta's GitHub profile</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- soft grid -->
  <g stroke="#334155" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320"/>
  </g>

  <!-- left accent bar -->
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>

  <!-- abstract SaaS / product blocks -->
  <g transform="translate(860,58)">
    <rect x="0" y="0" width="230" height="140" rx="16" fill="#111827" stroke="#14b8a6" stroke-opacity="0.55"/>
    <rect x="18" y="22" width="90" height="10" rx="5" fill="#2dd4bf" opacity="0.9"/>
    <rect x="18" y="44" width="160" height="8" rx="4" fill="#64748b"/>
    <rect x="18" y="62" width="140" height="8" rx="4" fill="#475569"/>
    <rect x="18" y="90" width="64" height="28" rx="8" fill="#14b8a6" opacity="0.85"/>
    <rect x="92" y="90" width="64" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
    <circle cx="250" cy="28" r="42" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <circle cx="250" cy="28" r="18" fill="#14b8a6" opacity="0.85"/>
    <rect x="40" y="168" width="180" height="54" rx="12" fill="#0f172a" stroke="#334155"/>
    <rect x="56" y="186" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="56" y="202" width="110" height="8" rx="4" fill="#475569"/>
  </g>

  <text x="48" y="118" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#2dd4bf" letter-spacing="2">GITHUB PROFILE</text>
  <text x="48" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Yash Gupta</text>
  <text x="48" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">AI Digital Solutions · SaaS Builder · Full-Stack Engineer</text>
  <text x="48" y="272" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#64748b">idea ’ architecture ’ product ’ production</text>
</svg>
