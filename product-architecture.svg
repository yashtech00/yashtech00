<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Product and SaaS architecture</title>
  <desc id="desc">Architecture showing product UI, APIs, AI layer, data, and workers</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#panel)" stroke="#1e293b"/>

  <text x="48" y="48" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">How I ship digital products</text>
  <text x="48" y="76" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Product UI | APIs | AI capabilities | Data | Workers | Cloud</text>

  <g stroke="url(#line)" stroke-width="2" fill="none">
    <path d="M220 190 H360"/>
    <path d="M540 190 H680"/>
    <path d="M860 190 H980"/>
    <path d="M450 250 V300"/>
    <path d="M770 250 V300"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="48" y="130" width="172" height="120" rx="16" fill="#111827" stroke="#14b8a6" stroke-opacity="0.7"/>
    <text x="134" y="178" text-anchor="middle" fill="#2dd4bf" font-size="15" font-weight="700">Product UI</text>
    <text x="134" y="204" text-anchor="middle" fill="#94a3b8" font-size="12">Next.js / React</text>
    <text x="134" y="224" text-anchor="middle" fill="#64748b" font-size="12">Dashboards and flows</text>

    <rect x="360" y="130" width="180" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <text x="450" y="178" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">API Layer</text>
    <text x="450" y="204" text-anchor="middle" fill="#94a3b8" font-size="12">Node / REST / Auth</text>
    <text x="450" y="224" text-anchor="middle" fill="#64748b" font-size="12">Business logic</text>

    <rect x="680" y="130" width="180" height="120" rx="16" fill="#111827" stroke="#14b8a6" stroke-opacity="0.7"/>
    <text x="770" y="178" text-anchor="middle" fill="#2dd4bf" font-size="15" font-weight="700">AI Layer</text>
    <text x="770" y="204" text-anchor="middle" fill="#94a3b8" font-size="12">LLMs / Assistants</text>
    <text x="770" y="224" text-anchor="middle" fill="#64748b" font-size="12">Automation and search</text>

    <rect x="980" y="130" width="172" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <text x="1066" y="178" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Cloud</text>
    <text x="1066" y="204" text-anchor="middle" fill="#94a3b8" font-size="12">Vercel / Docker</text>
    <text x="1066" y="224" text-anchor="middle" fill="#64748b" font-size="12">Deploy and scale</text>

    <rect x="360" y="300" width="180" height="80" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="450" y="336" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">Data Platform</text>
    <text x="450" y="358" text-anchor="middle" fill="#64748b" font-size="12">Postgres / Mongo / Redis</text>

    <rect x="680" y="300" width="180" height="80" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="770" y="336" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">Workers and Jobs</text>
    <text x="770" y="358" text-anchor="middle" fill="#64748b" font-size="12">Queues / retries / jobs</text>
  </g>

  <circle cx="290" cy="190" r="4" fill="#2dd4bf"/>
  <circle cx="610" cy="190" r="4" fill="#2dd4bf"/>
  <circle cx="920" cy="190" r="4" fill="#2dd4bf"/>
</svg>
