<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Product &amp; SaaS architecture</title>
  <desc id="desc">Animated-style architecture showing product UI, APIs, AI layer, data, and workers</desc>
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#panel)" stroke="#1e293b"/>

  <!-- title -->
  <text x="48" y="48" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">How I ship digital products</text>
  <text x="48" y="76" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748b">Product UI · APIs · AI capabilities · Data · Workers · Cloud</text>

  <!-- connection lines -->
  <g stroke="url(#line)" stroke-width="2" fill="none">
    <path d="M220 190 H360"/>
    <path d="M540 190 H680"/>
    <path d="M860 190 H980"/>
    <path d="M450 250 V300"/>
    <path d="M770 250 V300"/>
  </g>

  <!-- nodes -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Product UI -->
    <rect x="48" y="130" width="172" height="120" rx="16" fill="#111827" stroke="#14b8a6" stroke-opacity="0.7"/>
    <text x="134" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#2dd4bf">Product UI</text>
    <text x="134" y="204" text-anchor="middle" font-size="12" fill="#94a3b8">Next.js · React</text>
    <text x="134" y="224" text-anchor="middle" font-size="12" fill="#64748b">Dashboards &amp; flows</text>

    <!-- API layer -->
    <rect x="360" y="130" width="180" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <text x="450" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">API Layer</text>
    <text x="450" y="204" text-anchor="middle" font-size="12" fill="#94a3b8">Node · REST · Auth</text>
    <text x="450" y="224" text-anchor="middle" font-size="12" fill="#64748b">Business logic</text>

    <!-- AI capabilities -->
    <rect x="680" y="130" width="180" height="120" rx="16" fill="#111827" stroke="#14b8a6" stroke-opacity="0.7"/>
    <text x="770" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#2dd4bf">AI Layer</text>
    <text x="770" y="204" text-anchor="middle" font-size="12" fill="#94a3b8">LLMs · Assistants</text>
    <text x="770" y="224" text-anchor="middle" font-size="12" fill="#64748b">Automation &amp; search</text>

    <!-- Cloud -->
    <rect x="980" y="130" width="172" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <text x="1066" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Cloud</text>
    <text x="1066" y="204" text-anchor="middle" font-size="12" fill="#94a3b8">Vercel · Docker</text>
    <text x="1066" y="224" text-anchor="middle" font-size="12" fill="#64748b">Deploy &amp; scale</text>

    <!-- Data -->
    <rect x="360" y="300" width="180" height="80" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="450" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#cbd5e1">Data Platform</text>
    <text x="450" y="358" text-anchor="middle" font-size="12" fill="#64748b">Postgres · Mongo · Redis</text>

    <!-- Workers -->
    <rect x="680" y="300" width="180" height="80" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="770" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#cbd5e1">Workers &amp; Jobs</text>
    <text x="770" y="358" text-anchor="middle" font-size="12" fill="#64748b">Queues · retries · jobs</text>
  </g>

  <!-- pulse dots -->
  <circle cx="290" cy="190" r="4" fill="#2dd4bf">
    <animate attributeName="cx" values="220;360;220" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="610" cy="190" r="4" fill="#2dd4bf">
    <animate attributeName="cx" values="540;680;540" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
