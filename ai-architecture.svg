<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI system architecture workflow</title>
  <desc id="desc">Animated flow from product experience through services, orchestration, retrieval and evaluation</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".5" stop-color="#071426"/>
      <stop offset="1" stop-color="#081F25"/>
    </linearGradient>
    <linearGradient id="flow" x1="118" y1="190" x2="1088" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset=".48" stop-color="#2DD4BF"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity=".055"/></pattern>
    <path id="mainPath" d="M135 197H1067"/>
    <style>
      .wire { stroke-dasharray: 7 11; animation: dash 8s linear infinite; }
      .node { transform-box: fill-box; transform-origin: center; animation: breathe 3.5s ease-in-out infinite; }
      .node.n2 { animation-delay: -.7s; }.node.n3 { animation-delay: -1.4s;}.node.n4 { animation-delay: -2.1s;}.node.n5 { animation-delay: -2.8s;}
      .led { animation: led 1.6s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -180; } }
      @keyframes breathe { 0%,100% { opacity: .86; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-5px); } }
      @keyframes led { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#panel)" stroke="#1E293B" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#dots)"/>
  <text x="48" y="61" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">How I architect AI-first products</text>
  <text x="48" y="91" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">USER INTENT → RELIABLE SERVICES → GROUNDED INTELLIGENCE → MEASURABLE OUTPUT</text>

  <path d="M135 197H1067" stroke="#172033" stroke-width="8" stroke-linecap="round"/>
  <use href="#mainPath" stroke="url(#flow)" stroke-width="2" class="wire"/>

  <g class="node">
    <rect x="46" y="142" width="178" height="112" rx="18" fill="#071827" stroke="#0E7490"/>
    <circle cx="69" cy="164" r="4" fill="#38BDF8" class="led" filter="url(#glow)"/>
    <text x="135" y="188" text-anchor="middle" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Product Experience</text>
    <text x="135" y="214" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">UX · CHAT · WORKFLOWS</text>
  </g>
  <g class="node n2">
    <rect x="280" y="142" width="178" height="112" rx="18" fill="#071B26" stroke="#0F766E"/>
    <circle cx="303" cy="164" r="4" fill="#2DD4BF" class="led" filter="url(#glow)"/>
    <text x="369" y="188" text-anchor="middle" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Platform Services</text>
    <text x="369" y="214" text-anchor="middle" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">API · AUTH · QUEUES</text>
  </g>
  <g class="node n3">
    <rect x="514" y="130" width="178" height="136" rx="18" fill="#092524" stroke="#14B8A6" stroke-width="1.5"/>
    <circle cx="537" cy="153" r="4" fill="#5EEAD4" class="led" filter="url(#glow)"/>
    <text x="603" y="180" text-anchor="middle" fill="#F0FDFA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750">AI Orchestrator</text>
    <text x="603" y="207" text-anchor="middle" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">TOOLS · ROUTING · MEMORY</text>
    <rect x="548" y="226" width="110" height="22" rx="11" fill="#0F3A35"/>
    <text x="603" y="241" text-anchor="middle" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">CONTROL PLANE</text>
  </g>
  <g class="node n4">
    <rect x="748" y="142" width="178" height="112" rx="18" fill="#0B1B2C" stroke="#2563EB"/>
    <circle cx="771" cy="164" r="4" fill="#60A5FA" class="led" filter="url(#glow)"/>
    <text x="837" y="188" text-anchor="middle" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Knowledge Layer</text>
    <text x="837" y="214" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">RAG · OKF · VECTOR DB</text>
  </g>
  <g class="node n5">
    <rect x="982" y="142" width="172" height="112" rx="18" fill="#15182D" stroke="#4F46E5"/>
    <circle cx="1005" cy="164" r="4" fill="#A5B4FC" class="led" filter="url(#glow)"/>
    <text x="1068" y="188" text-anchor="middle" fill="#EEF2FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Model + Quality</text>
    <text x="1068" y="214" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LLM · EVAL · GUARDRAILS</text>
  </g>

  <circle r="5" fill="#FFFFFF" filter="url(#glow)"><animateMotion dur="5.8s" repeatCount="indefinite"><mpath href="#mainPath"/></animateMotion></circle>
  <circle r="4" fill="#5EEAD4" filter="url(#glow)"><animateMotion dur="5.8s" begin="-2s" repeatCount="indefinite"><mpath href="#mainPath"/></animateMotion></circle>
  <circle r="4" fill="#A5B4FC" filter="url(#glow)"><animateMotion dur="5.8s" begin="-4s" repeatCount="indefinite"><mpath href="#mainPath"/></animateMotion></circle>

  <text x="600" y="302" text-anchor="middle" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Designed for scale with workers, caching, observability, fallbacks, and real-time delivery.</text>
</svg>
